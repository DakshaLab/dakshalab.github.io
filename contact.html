<!doctype html>
<!-- This page's text lives below. Phone, address, hours & other settings: config.js. Tests, packages, FAQs: data.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &amp; Directions | Daksha Lab Bagalkot</title>
<meta name="description" content="Address, working hours, phone and WhatsApp for Daksha Lab, Bagalkot.">
<meta name="theme-color" content="#0f766e">
<meta property="og:title" content="Contact &amp; Directions | Daksha Lab Bagalkot">
<meta property="og:description" content="Address, working hours, phone and WhatsApp for Daksha Lab, Bagalkot.">
<meta property="og:type" content="website">
<link rel="icon" href="logo-drop.svg">
<meta property="og:image" content="https://dakshalab.github.io/og-image.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white font-sans text-slate-800 antialiased" data-page="contact">
<div id="site-header"></div>
<main>
<section class="page-hero">
  <div class="mx-auto max-w-6xl px-4">
    <h1 class="h1">{{text.contact.title}}</h1>
    <p class="mt-2 max-w-2xl text-slate-600">{{text.contact.intro}}</p>
  </div>
</section>
<section class="py-12">
  <div class="mx-auto max-w-6xl space-y-8 px-4">
    <div data-location="full"></div>
    <div class="grid gap-6 md:grid-cols-2">
      <div class="card">
        <div class="flex items-center justify-between gap-3"><h2 class="font-semibold text-slate-900">{{text.contact.hoursTitle}}</h2><span id="open-status"></span></div>
        <dl id="hours-table" class="mt-3 space-y-1 text-sm text-slate-700"></dl>
      </div>
      <div class="card">
        <h2 class="font-semibold text-slate-900">{{text.contact.contactTitle}}</h2>
        <div class="mt-4 grid gap-3 sm:grid-cols-2">
          <a data-tel href="#" class="btn-outline">📞 <span data-site="phoneDisplay" class="ml-1"></span></a>
          <a data-wa="{{messages.general}}" href="#" class="btn-wa"><span data-icon="wa"></span>WhatsApp us</a>
          <a href="book.html" class="btn-primary sm:col-span-2">{{text.contact.bookButton}}</a>
        </div>
        <p class="mt-3 text-sm text-slate-500">{{text.contact.emailLabel}} <span data-site="email"></span></p>
      </div>
    </div>
  </div>
</section>

</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
