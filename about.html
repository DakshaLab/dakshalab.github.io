<!doctype html>
<!-- This page's text lives below. Phone, address, hours & other settings: config.js. Tests, packages, FAQs: data.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Us | Daksha Lab Bagalkot</title>
<meta name="description" content="Daksha Lab, Bagalkot: accurate reports, qualified MD pathologists, same-day reports. Located inside Ashirwad Hospital, Navanagar Road.">
<meta name="theme-color" content="#0f766e">
<meta property="og:title" content="About Us | Daksha Lab Bagalkot">
<meta property="og:description" content="Daksha Lab, Bagalkot: accurate reports, qualified MD pathologists, same-day reports. Located inside Ashirwad Hospital, Navanagar Road.">
<meta property="og:type" content="website">
<link rel="icon" href="logo-drop.svg">
<meta property="og:image" content="https://dakshalab.github.io/og-image.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white font-sans text-slate-800 antialiased" data-page="about">
<div id="site-header"></div>
<main>
<section class="page-hero">
  <div class="mx-auto max-w-6xl px-4">
    <h1 class="h1">{{text.about.title}}</h1>
    <p class="mt-2 max-w-2xl text-slate-600">{{text.about.intro}}</p>
  </div>
</section>
<section class="py-12">
  <div class="mx-auto grid max-w-6xl gap-10 px-4 md:grid-cols-2">
    <div class="space-y-4 text-slate-700">
      <div id="about-story" class="space-y-4"></div>
      <p class="rounded-xl bg-slate-50 p-4 text-sm text-slate-600 ring-1 ring-slate-200">{{relationText}}</p>
    </div>
    <div class="space-y-5">
      <div class="rounded-2xl bg-teal-900 p-6 text-white">
        <p class="text-sm font-semibold text-teal-200">{{text.about.pathologistLabel}}</p>
        <p id="patho-name" class="mt-1 text-xl font-bold"></p>
        <p id="patho-reg" class="mt-1 text-sm text-teal-100"></p>
      </div>
      <div class="grid grid-cols-2 gap-4" data-list="text.about.stats"><template><div class="card"><p class="text-2xl font-extrabold text-teal-700">{{.value}}</p><p class="mt-1 text-sm text-slate-600">{{.label}}</p></div></template></div>
      <div class="card"><h2 class="font-semibold text-slate-900">{{text.about.qualityTitle}}</h2>
        <ul class="mt-3 space-y-2 text-sm text-slate-700" data-list="text.about.quality"><template><li>✓ {{.}}</li></template></ul></div>
    </div>
  </div>
</section>
<section id="gallery-section" class="hidden pb-16">
  <div class="mx-auto max-w-6xl px-4">
    <h2 class="h2">{{text.about.galleryTitle}}</h2>
    
    <div id="gallery" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    <a id="gallery-more" href="#" target="_blank" rel="noopener" class="btn-outline mt-6 !py-2.5 text-sm">{{text.about.galleryButton}}</a>
  </div>
</section>

</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
