<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Bagalkot landscape: Badami cliffs, a Chalukya-style temple, Almatti dam and the Krishna river">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ccfbf1"/><stop offset=".65" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <pattern id="ilkal" width="40" height="28" patternUnits="userSpaceOnUse">
      <rect width="40" height="28" fill="#b91c1c"/>
      <path d="M0 22 L10 8 L20 22 L30 8 L40 22" fill="none" stroke="#fde68a" stroke-width="3"/>
      <circle cx="10" cy="22" r="2" fill="#fde68a"/><circle cx="30" cy="22" r="2" fill="#fde68a"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#sky)"/>
  <circle cx="1180" cy="150" r="70" fill="#fdba74" opacity=".85"/>
  <!-- birds -->
  <path d="M520 110 q10 -10 20 0 q10 -10 20 0 M600 140 q8 -8 16 0 q8 -8 16 0" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>

  <!-- far hills -->
  <path d="M0 330 Q200 250 380 300 T760 290 T1150 300 T1600 280 V520 H0 Z" fill="#99f6e4" opacity=".6"/>

  <!-- Badami-style red sandstone cliffs, left -->
  <path d="M0 360 V250 L60 235 L80 200 L150 190 L170 215 L240 205 L270 240 L330 245 L360 300 L420 310 L440 360 Z" fill="url(#cliff)"/>
  <path d="M60 300 h40 v30 h-40z M130 290 h50 v40 h-50z M210 300 h36 v30 h-36z" fill="#7c2d12" opacity=".7"/><!-- cave openings -->
  <path d="M70 250 L330 262 M90 275 L360 285" stroke="#fdba74" stroke-width="3" opacity=".5"/>

  <!-- Chalukya-style temple silhouette, centre-left -->
  <g fill="#7c2d12">
    <rect x="520" y="300" width="170" height="60"/>
    <rect x="535" y="280" width="140" height="22"/>
    <path d="M560 280 L575 240 H635 L650 280 Z"/>
    <path d="M572 240 L585 205 H625 L638 240 Z"/>
    <path d="M584 205 L594 178 H616 L626 205 Z"/>
    <circle cx="605" cy="168" r="11"/>
    <rect x="602" y="146" width="6" height="14"/>
    <rect x="700" y="318" width="70" height="42"/><path d="M700 318 L735 292 L770 318 Z"/>
  </g>
  <g fill="#fde68a" opacity=".55"><rect x="545" y="315" width="10" height="45"/><rect x="575" y="315" width="10" height="45"/><rect x="625" y="315" width="10" height="45"/><rect x="655" y="315" width="10" height="45"/></g>

  <!-- Almatti-style dam with gates, right -->
  <g>
    <rect x="980" y="270" width="620" height="90" fill="#e2e8f0"/>
    <rect x="980" y="262" width="620" height="12" fill="#94a3b8"/>
    <g fill="#64748b">
      <rect x="1000" y="285" width="34" height="60" rx="4"/><rect x="1050" y="285" width="34" height="60" rx="4"/><rect x="1100" y="285" width="34" height="60" rx="4"/>
      <rect x="1150" y="285" width="34" height="60" rx="4"/><rect x="1200" y="285" width="34" height="60" rx="4"/><rect x="1250" y="285" width="34" height="60" rx="4"/>
      <rect x="1300" y="285" width="34" height="60" rx="4"/><rect x="1350" y="285" width="34" height="60" rx="4"/><rect x="1400" y="285" width="34" height="60" rx="4"/>
      <rect x="1450" y="285" width="34" height="60" rx="4"/><rect x="1500" y="285" width="34" height="60" rx="4"/><rect x="1550" y="285" width="34" height="60" rx="4"/>
    </g>
    <g fill="#ffffff" opacity=".85">
      <rect x="1103" y="345" width="28" height="18"/><rect x="1203" y="345" width="28" height="18"/><rect x="1303" y="345" width="28" height="18"/><rect x="1403" y="345" width="28" height="18"/>
    </g>
  </g>

  <!-- Krishna river -->
  <path d="M0 360 H1600 V460 H0 Z" fill="url(#water)"/>
  <path d="M40 390 q30 -10 60 0 t60 0 M300 410 q30 -10 60 0 t60 0 M760 395 q30 -10 60 0 t60 0 M1150 415 q30 -10 60 0 t60 0 M1420 392 q30 -10 60 0 t60 0" fill="none" stroke="#ccfbf1" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <!-- boat (coracle) -->
  <ellipse cx="880" cy="430" rx="34" ry="10" fill="#7c2d12"/>

  <!-- Ilkal saree border -->
  <rect y="460" width="1600" height="60" fill="url(#ilkal)"/>
  <rect y="458" width="1600" height="6" fill="#fde68a"/>
</svg>
