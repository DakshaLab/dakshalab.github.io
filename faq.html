<!doctype html>
<!-- This page's text lives below. Phone, address, hours & other settings: config.js. Tests, packages, FAQs: data.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ | Daksha Lab Bagalkot</title>
<meta name="description" content="Answers about fasting, report timing, payment and appointments at Daksha Lab, Bagalkot.">
<meta name="theme-color" content="#0f766e">
<meta property="og:title" content="FAQ | Daksha Lab Bagalkot">
<meta property="og:description" content="Answers about fasting, report timing, payment and appointments at Daksha Lab, Bagalkot.">
<meta property="og:type" content="website">
<link rel="icon" href="logo-drop.svg">
<meta property="og:image" content="https://dakshalab.github.io/og-image.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white font-sans text-slate-800 antialiased" data-page="faq">
<div id="site-header"></div>
<main>
<section class="page-hero">
  <div class="mx-auto max-w-6xl px-4">
    <h1 class="h1">{{text.faq.title}}</h1>
    <p class="mt-2 max-w-2xl text-slate-600">{{text.faq.intro}}</p>
  </div>
</section>
<section class="pt-12">
  <div class="mx-auto max-w-3xl px-4">
    <h2 class="text-2xl font-bold text-slate-900">{{text.faq.prepTitle}}</h2>
    <p class="mt-1 text-slate-600">{{text.faq.prepIntro}}</p>
    <div id="prep-guide" class="mt-5 space-y-3"></div>
  </div>
</section>
<section class="py-12">
  <div class="mx-auto max-w-3xl px-4">
    <h2 class="mb-5 text-2xl font-bold text-slate-900">{{text.faq.questionsTitle}}</h2>
    <div id="faq-list" class="space-y-3"></div>
    <div class="mt-10 rounded-2xl bg-slate-50 p-6 text-center ring-1 ring-slate-200">
      <p class="font-semibold text-slate-900">{{text.faq.askTitle}}</p>
      <div class="mt-4 flex flex-col justify-center gap-3 sm:flex-row">
        <a data-wa="{{messages.general}}" href="#" class="btn-wa !px-5"><span data-icon="wa"></span>{{text.faq.askButton}}</a>
        <a data-tel href="#" class="btn-outline !px-5">{{text.faq.callButton}} <span data-site="phoneDisplay" class="ml-1"></span></a>
      </div>
    </div>
  </div>
</section>

</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
